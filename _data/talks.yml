- title: "A Cloud Native Geo Upgrade for Spatial Data Infrastructure"
  venue: "Open Geodag 2026"
  venue_url: "https://www.geonovum.nl/agenda/open-geodag-2026"
  location: "Amersfoort, NL"
  date: 2026-05-12
  date_display: "May&nbsp;12,&nbsp;2026"
  abstract: "A case for replacing the traditional server-based SDI stack with cloud-native formats &mdash; COG, GeoParquet, STAC &mdash; and object storage: faster, cheaper, AI-ready, and sovereign. Portolan as a working blueprint."
