- title: "Towards an Open Geo Web: Linking Open Source's 'Architectures of Participation' to the Global SDI Initiative"
  venue: "GSDI-10"
  # gsdi.org is gone, so no venue link
  location: "Trinidad"
  date: 2008-02-28
  date_display: "February&nbsp;2008"
  abstract: "Why Google's private infrastructure had done more for sharing geospatial data than hundreds of national SDI initiatives &mdash; read through open source's &lsquo;architectures of participation&rsquo;. Barriers to entry, treating users as contributors, and a sketch of a &lsquo;GeoPortal 2.0&rsquo; built to invite them in. Also the soft launch of OpenGeo.org."
  links:
